version: '3.8'

services:
  fastcar-app:
    build: .
    container_name: fast-car-web
    ports:
      - "8204:8204"
    environment:
      - PORT=8204
      - SECRET_KEY=${SECRET_KEY:-fastcar_secret_key_2026}
      - DOMAIN_URL=${DOMAIN_URL:-http://localhost:8204}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-price_placeholder}
    restart: unless-stopped
